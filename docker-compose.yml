# Official playground / quickstart style: one RisingWave process, psql on :4566.
# Default pin is the current prod-class image (see VERSION):
#   risingwavelabs/risingwave:v3.0.2
# After Step 1 underfills, compare with:
#   RW_IMAGE=risingwavelabs/risingwave:v3.1.0-rc.1 docker compose up
services:
  risingwave:
    image: ${RW_IMAGE:-risingwavelabs/risingwave:v3.0.2}
    container_name: rw-sink-into-snapshot-repro
    command: ["single_node", "--in-memory"]
    ports:
      - "4566:4566"
      - "5691:5691"
    environment:
      ENABLE_TELEMETRY: "false"
      RUST_BACKTRACE: "1"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4566'"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  tester:
    profiles: ["test"]
    image: postgres:16
    depends_on:
      risingwave:
        condition: service_healthy
    environment:
      PGHOST: risingwave
      PGPORT: "4566"
      PGDATABASE: dev
      PGUSER: root
      N_USERS: "${N_USERS:-3000}"
      EXPECT: "${EXPECT:-report}"
      RW_IMAGE: "${RW_IMAGE:-risingwavelabs/risingwave:v3.0.2}"
    volumes:
      - .:/repro
    working_dir: /repro
    entrypoint: ["bash", "/repro/scripts/run-repro.sh"]
