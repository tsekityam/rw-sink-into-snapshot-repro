name: repro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sink-into-snapshot:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Broken baseline: #26713 wipe must be visible (EXPECT=bug → green CI).
          - name: v3.0.3 (expect bug)
            image: risingwavelabs/risingwave:v3.0.3
            expect: bug
          # Fix image: wide columns must survive the stream-key move.
          - name: v3.1.0-rc.1 (expect fix)
            image: risingwavelabs/risingwave:v3.1.0-rc.1
            expect: fix
    env:
      RW_IMAGE: ${{ matrix.image }}
      EXPECT: ${{ matrix.expect }}
      N_USERS: "500"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start RisingWave (compose / playground-style single_node)
        run: docker compose up -d --wait risingwave

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for SQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/wait-for-rw.sh

      - name: Run repro
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/run-repro.sh

      - name: RisingWave logs
        if: failure()
        run: docker compose logs --no-color risingwave
