name: repro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sink-into-underfill:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v3.0.2 prod-shape
            image: risingwavelabs/risingwave:v3.0.2
          - name: v3.1.0-rc.1 same SQL
            image: risingwavelabs/risingwave:v3.1.0-rc.1
    env:
      RW_IMAGE: ${{ matrix.image }}
      N_USERS: "3000"
      EXPECT: report
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start RisingWave (compose / playground-style single_node)
        run: docker compose up -d --wait risingwave

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for SQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/wait-for-rw.sh

      - name: Run repro
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/run-repro.sh

      - name: RisingWave logs
        if: failure()
        run: docker compose logs --no-color risingwave
